# CI for Unreal Open MCP.
#
# - bootstrap: required repo paths present.
# - version-sync: generated version targets match version.json.
# - mcp-server: typecheck + test for the stdio MCP server package.
# - e2e-smoke: end-to-end stdio smoke over the BUILT artifact against a loopback
#   bridge stub (no editor required).
# - cli: typecheck + test + build for the unreal-open-mcp-cli package.
# - editor-boundary: Editor/Runtime module boundary guard (Runtime must never
#   reference Editor — see scripts/check-editor-boundary.py).

name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  bootstrap:
    name: Repo bootstrap check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required paths exist
        run: |
          set -e
          for path in \
            mcp-server \
            packages/bridge \
            packages/verify \
            cli \
            skills \
            demo \
            scripts \
            docs \
            docs/api \
            version.json \
            scripts/sync-version.mjs \
            README.md \
            docs/architecture.md \
            docs/api.md \
            docs/porting-principles.md \
            AGENTS.md; do
            test -e "$path" || { echo "Missing required path: $path"; exit 1; }
          done
          echo "All required bootstrap paths present."

  version-sync:
    name: Version sync check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify trio targets match version.json
        run: node scripts/sync-version.mjs --check

  mcp-server:
    name: MCP server (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  e2e-smoke:
    # End-to-end stdio smoke over the built artifact. Each script spawns its own
    # loopback bridge stub, so no Unreal editor is needed. Nothing ran these in
    # CI before, which is how the p1 script came to fail permanently against a
    # stale tool roster without anyone noticing.
    name: E2E smoke (stdio <-> bridge stub)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Smoke — stdio lifecycle + tools/list + ping round-trip
        run: npm run smoke:p1

      - name: Smoke — tool dispatch (offline + structured tool error)
        run: npm run smoke:p2

      - name: Smoke — asset_find MCP <-> bridge round-trip
        run: npm run smoke:p4

  cli:
    # Setup/ops CLI (unreal-open-mcp-cli) — separate package (ADR-007). The CLI
    # has no runtime deps, so install is dev-only (typescript + @types/node).
    name: CLI (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        # No published lockfile yet for the new package; npm install generates
        # one. Switch to `npm ci` once cli/package-lock.json is committed.
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke — --help / --version fast paths
        run: |
          node dist/index.js --help
          node dist/index.js --version

  editor-boundary:
    name: Editor/Runtime boundary guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify detector self-test
        # Proves the detector fires and that suppression works — guards
        # against a regression in the guard itself.
        run: python scripts/check-editor-boundary.py --self-test

      - name: Boundary check (Runtime must not reference Editor)
        run: python scripts/check-editor-boundary.py

  demo-project:
    # Demo C++ project fixture root. Always validates the project structure
    # (.uproject parses as JSON, required source/config files present, the
    # UE-generated trees are gitignored so an editor open never dirties the
    # tree). The UE build itself only runs when an engine is reachable —
    # GitHub-hosted runners have no UE install, so the build step detects the
    # engine and skips with a clear log otherwise (a self-hosted UE 5.8 runner
    # sets UE_ENGINE_ROOT to opt into the build).
    name: Demo project (structure + conditional build)
    runs-on: ubuntu-latest
    env:
      # Repository variable a self-hosted UE 5.8 runner sets to opt into the
      # build. Absent on hosted runners → build step skips with a clear log.
      UE_ENGINE_ROOT: ${{ vars.UE_ENGINE_ROOT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          set -e
          echo "Validating demo/ structure..."
          test -f demo/UnrealOpenMcpDemo.uproject || { echo "Missing demo/*.uproject"; exit 1; }
          test -f demo/Source/UnrealOpenMcpDemo/UnrealOpenMcpDemo.Build.cs || { echo "Missing module Build.cs"; exit 1; }
          test -f demo/Source/UnrealOpenMcpDemo/Private/UnrealOpenMcpDemoModule.cpp || { echo "Missing module cpp"; exit 1; }
          test -f demo/Source/UnrealOpenMcpDemoEditor.Target.cs || { echo "Missing editor target"; exit 1; }
          test -f demo/Config/DefaultEngine.ini || { echo "Missing DefaultEngine.ini"; exit 1; }
          test -f demo/README.md || { echo "Missing demo README"; exit 1; }
          test -f demo/.gitignore || { echo "Missing demo .gitignore"; exit 1; }
          # The descriptor is strict JSON (UE rejects comments) — confirm it parses.
          python3 -c "import json,sys; json.load(open('demo/UnrealOpenMcpDemo.uproject'))" \
            || { echo "demo/*.uproject is not valid JSON"; exit 1; }
          echo "demo/ structure OK."

      - name: Validate gitignore coverage
        # Belt-and-braces: the demo .gitignore must cover every UE-generated
        # tree so a smoke editor open never leaves Binaries/Intermediate/Saved
        # behind in the working tree.
        run: |
          set -e
          for dir in Binaries Intermediate Saved DerivedDataCache Script .vs; do
            grep -q "^${dir}/" demo/.gitignore || { echo "demo/.gitignore missing ${dir}/"; exit 1; }
          done
          echo "demo/ gitignore coverage OK."

      - name: Setup Node
        # Node is only needed to run the CLI installer before the build (when UE
        # is available). Kept as a separate step so the skip path stays Node-free.
        if: env.UE_ENGINE_ROOT != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build demo (when Unreal Engine is available)
        # UE is not installed on GitHub-hosted runners. A self-hosted runner
        # with UE 5.8 installed opts in via UE_ENGINE_ROOT (the engine's
        # Engine/... root). Absent that, the build is skipped — the structural
        # validation above is the always-on guard.
        run: |
          if [ -z "${UE_ENGINE_ROOT}" ]; then
            echo "::notice::Unreal Engine not available (UE_ENGINE_ROOT unset). Skipping demo build."
            echo "To build the demo in CI, run this job on a self-hosted runner with UE 5.8 installed"
            echo "and UE_ENGINE_ROOT (a repository variable) pointing at the engine root"
            echo "(e.g. /Users/Shared/Epic Games/UE_5.8 or C:\\Program Files\\Epic Games\\UE_5.8)."
            exit 0
          fi
          echo "UE_ENGINE_ROOT=${UE_ENGINE_ROOT}"
          # The working directory is the repo root (GITHUB_WORKSPACE).
          DEMO_UPROJECT="${GITHUB_WORKSPACE}/demo/UnrealOpenMcpDemo.uproject"
          # Build the CLI (dev deps only) so install-plugin can place the plugin
          # source from packages/ into demo/Plugins before UBT compiles it.
          (cd cli && npm install && npm run build)
          node cli/dist/index.js install-plugin --project "${GITHUB_WORKSPACE}/demo"
          # Pick the platform's Build.sh — Linux on ubuntu, Mac on a macOS runner.
          if [ -x "${UE_ENGINE_ROOT}/Engine/Build/BatchFiles/Linux/Build.sh" ]; then
            BUILD="${UE_ENGINE_ROOT}/Engine/Build/BatchFiles/Linux/Build.sh"
            PLATFORM=Linux
          elif [ -x "${UE_ENGINE_ROOT}/Engine/Build/BatchFiles/Mac/Build.sh" ]; then
            BUILD="${UE_ENGINE_ROOT}/Engine/Build/BatchFiles/Mac/Build.sh"
            PLATFORM=Mac
          else
            echo "UE_ENGINE_ROOT set but no Build.sh found under it"; exit 1
          fi
          "${BUILD}" UnrealOpenMcpDemoEditor "${PLATFORM}" Development -Project="${DEMO_UPROJECT}"
